name: Order worker

# Drives an order someone started in the app through Sainsbury's. The
# startOrder Firebase function starts it the moment an order is sent; this
# hourly timer is only a backup (GitHub runs timers late, often by hours).
# The keepWorkerOn function stops GitHub switching it off after 60 quiet days.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: order-worker
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SAINSBURYS_EMAIL: ${{ secrets.SAINSBURYS_EMAIL }}
      SAINSBURYS_PASSWORD: ${{ secrets.SAINSBURYS_PASSWORD }}
      WORKER_QUIET: '1'
      WORKER_MINUTES: '110'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' }
      - id: check
        run: node worker/run.mjs check
      - if: steps.check.outputs.work == 'yes'
        run: npx playwright install --with-deps chromium
      - if: steps.check.outputs.work == 'yes'
        run: xvfb-run -a node worker/run.mjs
